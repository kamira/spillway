# 實作相依清單(CHG-20261107-03 AM-13;已知限制 5)。
#
# Python 版照常全跑;本清單只在 SPILLWAY_IMPL=rust 時起作用:列出的測試依賴 Python 版的實作細節,換實作時要改夾具或
# 預期,不代表規格不同。不改 feature 文字、不加 behave tag。
#
# 欄位:kind = "behave"(id 為 feature 路徑 + "::" + 情境名稱)或 "pytest"(id 為 node ID,不含參數化後綴時涵蓋全部變體);
#       reason 寫明依賴哪個實作細節;scope(選填)說明只有其中一部分相依;
#       on_rust(CHG-20261108-01 AM-9,必填)見下;on_rust_reason 寫選擇理由(not_applicable 必填)。
#       [[file_entry]] 登記整個檔案(id 為檔案路徑),沒有 kind。
# on_rust:項目不會自動被略過或標成預期失敗。
#   not_applicable       Rust 下 deselect 並計數(tests/parity/gaps.py)。
#   gap                  測試原樣跑;失敗時要在 tests/parity/rust_gaps.toml 登記,否則就是失敗。
#   replace:<測試 id>    由替代測試承接跨實作行為;替代測試存在於本次收集結果時,本測試在 Rust 下 deselect 並計數(T2 仲裁 A2,依決策 5);
#                        替代測試不存在時照常跑、照常失敗。替代測試 id 是預定名稱:本筆尚未存在,由設定檔驅動 adapter CHG 新增(NFR-4 那一項由內建協定 adapter CHG 新增,AM-18)
#                        (可改名,同步本檔),不得等於自己的 id。全部 replace 都有替代測試是決策 5「追齊」的條件。
# 一致性:tests/blackbox/test_harness.py 斷言每個 [[entry]] 的 id 都在 artifacts/m5a/baseline/ 的基準清單裡;
#         tests/parity/test_gaps_file.py 以實際收集結果比對,並驗證 on_rust。

