<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帳本 · Spillway</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/ledger.css">
<script type="module" src="assets/js/ledger.js"></script>
</head>
<body>
<div class="shell">
<nav class="nav" aria-label="主選單">
<div class="brand">Spillway <span class="brand-sub">溢流閘</span></div>
<a href="/ui/">總覽</a>
<a href="/ui/members.html">成員</a>
<a href="/ui/groups.html">群組與 Tag</a>
<a href="/ui/routes.html">Route</a>
<a href="/ui/mcp.html">MCP 設定</a>
<a href="/ui/ledger.html" aria-current="page">帳本</a>
<a href="/ui/settings.html">設定</a>
<a href="/ui/api-reference.html">API 參考</a>
<div class="nav-host mono" id="nav-host"></div>
</nav>
<main class="main" id="main">
<div class="head">
<div>
<h1>帳本</h1>
<p class="sub">每次嘗試一列,含 fallback。點選任一列可查看該次的請求與回應內容。</p>
</div>
<div class="stack tight export-box">
<a class="btn" id="export-csv" href="/api/ledger/export.csv" download>匯出 CSV</a>
<span class="small warn-text" id="export-hint" hidden>符合的列超過 100,000 列,請縮小範圍後再匯出</span>
</div>
</div>
<form class="card row filters" id="filters" aria-label="篩選">
<label class="f">起<input type="date" id="f-from" name="from"></label>
<label class="f">訖(含當日)<input type="date" id="f-to" name="to"></label>
<label class="f">Route<select id="f-route" name="route"><option value="">全部</option></select></label>
<label class="f">成員<select id="f-deployment" name="deployment"><option value="">全部</option></select></label>
<label class="f">狀態<select id="f-status" name="status"><option value="">全部</option></select></label>
<label class="check"><input type="checkbox" id="f-fallback" name="min_depth">只看 fallback</label>
<button class="btn ghost" type="reset" id="f-reset">清除篩選</button>
</form>
<section class="card" aria-label="帳本紀錄">
<div class="scroll">
<table id="ledger-table">
<thead><tr><th>時間</th><th>Route</th><th>成員</th><th class="num">Slot</th><th>Effort</th><th class="num">預估 入 / 出 P90</th><th class="num">實際 入 / 出</th><th class="num">預估花費 P90</th><th class="num">實際花費</th><th>狀態</th><th class="num">延遲</th><th class="num">Fallback 深度</th></tr></thead>
<tbody id="ledger-body"></tbody>
</table>
</div>
<div class="row between">
<span class="muted" id="page-info"></span>
<div class="row"><button class="btn" type="button" id="page-prev" disabled>上一頁</button><button class="btn" type="button" id="page-next" disabled>下一頁</button></div>
</div>
</section>
</main>
<aside class="drawer" id="payload-panel" aria-labelledby="payload-title" hidden>
<div class="row between">
<h2 id="payload-title">紀錄內容</h2>
<button class="btn sm" type="button" id="payload-close">關閉</button>
</div>
<div class="row" id="payload-meta"></div>
<div id="payload-body" class="stack"></div>
</aside>
</div>
</body>
</html>
