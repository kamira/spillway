[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spillway"
version = "0.1.0"
description = "單人使用的 LLM 路由閘道"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "litellm>=1.50,<2",
  "pyyaml>=6",
  "pydantic>=2.6",
  "platformdirs>=4",
  "keyring>=24",
  "httpx>=0.27",
  # CHG-20261102-01 決策 6:官方 MCP SDK;jinja2 原為間接相依,改為明列
  "mcp>=1.30,<2",
  "jinja2>=3",
  # 決策 14 ①:`AppStatus.disable_automatic_graceful_drain()` 自 3.5.0(issue #211 修正)起
  # 才同時關掉 watcher 對 uvicorn `should_exit` 的後備偵測;較舊版本停用後仍會 auto-drain
  "sse-starlette>=3.5.0",
]

[project.optional-dependencies]
# CHG-20261103-01 決策 3:畫面測試(Chromium 1248 使用已快取的瀏覽器,不下載)
dev = ["pytest>=8", "behave>=1.2.6", "playwright==1.64.1"]

[project.scripts]
spillway = "spillway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# CHG-20261103-01 決策 5:畫面靜態檔
spillway = ["**/*.sql", "**/*.yaml", "**/*.md", "**/*.j2",
            "web/static/**/*.html", "web/static/**/*.css", "web/static/**/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
